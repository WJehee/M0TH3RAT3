[package]
name = "serve"
version = "0.1.0"
edition = "2021"
description = "Serve a widgets::Program to remote clients over SSH"

[dependencies]
widgets = { path = "../widgets" }
color-eyre = { workspace = true }
log = "0.4"
rand = "0.9"
ratatui = { workspace = true }
russh = "0.62"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "io-util", "time"] }
