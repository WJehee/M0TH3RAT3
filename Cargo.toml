[workspace]
resolver = "2"
members = [
    "crates/widgets",
    "crates/mothership",
    "crates/car",
    "crates/serve",
]

# Shared dependency versions so every crate links the same ratatui.
[workspace.dependencies]
color-eyre = "0.6.3"
ratatui = "0.29.0"
tachyonfx = "0.15.0"
throbber-widgets-tui = "0.8.0"
